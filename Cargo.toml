[workspace]
resolver = "2"
members = [
    "plugins/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gamesgamesgamesgamesgames/happyview-plugins"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# The SDK is not published; it is pulled from HappyView's `next` branch until it is.
happyview-plugin-sdk = { git = "https://github.com/gamesgamesgamesgamesgames/happyview", branch = "next" }

[profile.release]
opt-level = "s"
lto = true
